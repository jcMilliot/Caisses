name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Caisses ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # La release est créée en brouillon avec les binaires non signés ;
          # les étapes suivantes les remplacent par leurs versions signées Authenticode.

      - name: Uploader le MSI non signé comme artifact
        uses: actions/upload-artifact@v4
        id: upload-msi
        with:
          name: unsigned-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 1

      - name: Uploader le NSIS non signé comme artifact
        uses: actions/upload-artifact@v4
        id: upload-nsis
        with:
          name: unsigned-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1

      - name: Signer le MSI via SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "e4a80f19-4603-405b-be23-d7eec25a85a3"
          project-slug: "Caisses"
          signing-policy-slug: "test-signing"
          artifact-configuration-slug: "initial"
          github-artifact-id: "${{ steps.upload-msi.outputs.artifact-id }}"
          wait-for-completion: true
          output-artifact-directory: "signed/msi"

      - name: Signer le NSIS (.exe) via SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "e4a80f19-4603-405b-be23-d7eec25a85a3"
          project-slug: "Caisses"
          signing-policy-slug: "test-signing"
          artifact-configuration-slug: "nsis-installer"
          github-artifact-id: "${{ steps.upload-nsis.outputs.artifact-id }}"
          wait-for-completion: true
          output-artifact-directory: "signed/nsis"

      - name: Remplacer les installeurs par leurs versions signées
        shell: pwsh
        run: |
          Copy-Item -Path "signed/msi/*.msi" -Destination "src-tauri/target/release/bundle/msi/" -Force
          Copy-Item -Path "signed/nsis/*.exe" -Destination "src-tauri/target/release/bundle/nsis/" -Force

      - name: Re-uploader les installeurs signés sur la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "${{ github.ref_name }}" `
            (Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi").FullName `
            (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe").FullName `
            --clobber
